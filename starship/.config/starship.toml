format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$python\
$line_break\
$character"""

add_newline = false

[username]
format = '[$user]($style)@'
style_user = 'bold blue'

[hostname]
format = '[$hostname$ssh_symbol]($style):'
ssh_symbol = '🌐'

[directory]
truncate_to_repo = false
truncation_length = 8

